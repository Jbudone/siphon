name: Open Code Review
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: open-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: "!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Review through Alibaba Open Code Review
        uses: alibaba/open-code-review@7e5ce06c88de5ce81df5dc4f24e2e485b517fae8 # v1.13.10
        with:
          ocr_version: '1.13.10'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_url: https://openrouter.ai/api/v1/chat/completions
          llm_auth_token: ${{ secrets.OPENROUTER_API_KEY }}
          llm_model: anthropic/claude-sonnet-5.5
          llm_protocol: openai
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          language: English
          review_concurrency: '1'
          effort: medium
          # Aggregate usage guard; final rounds can exceed it. Not a dollar cap.
          max_tokens_budget: '300000'
          review_task_timeout: '10'
          llm_timeout: '180'
          rule: .github/review-rules.json
          # Review the complete merge-base range on every push, as PR-Agent does.
          checkpoint_range: 'false'
          incremental: 'false'
          sticky_summary: 'true'
          resolve_outdated: 'false'
          # Upload below to give audit reports an explicit retention period.
          upload_artifacts: 'false'
      - name: Retain Open Code Review audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-code-review-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
          if-no-files-found: warn
          retention-days: 90
      - name: Verify selected review coverage completed
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              result = json.loads(Path('/tmp/ocr-result.json').read_text())
              manifest = result['manifest']
              if manifest['schema_version'] != 'ocr.run-manifest/v1':
                  raise ValueError('Unsupported review manifest schema')
              coverage = manifest['coverage']
              selected = {item['item_id'] for item in coverage['selected']}
              finished = {item['item_id'] for key in ('completed', 'reused')
                          for item in coverage[key]}
              state = manifest['terminal_state']
              complete = (state == 'complete' or (state == 'skipped' and not selected))
              if (not complete or coverage['failed'] or coverage['waived']
                      or selected != finished):
                  raise ValueError(
                      f"Review coverage {state}: {len(finished)}/{len(selected)} completed/reused; "
                      f"{len(coverage['failed'])} failed, {len(coverage['waived'])} waived. "
                      'Inspect the retained report; zero findings does not mean complete coverage.')
              print(f'Review coverage {state}: {len(finished)}/{len(selected)} selected items completed/reused.')
          except (OSError, ValueError, KeyError, TypeError) as error:
              print(f'::error::Open Code Review coverage verification failed: {error}')
              sys.exit(1)
          PY
