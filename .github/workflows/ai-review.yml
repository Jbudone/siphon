name: PR-Agent review
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: "!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository"
    runs-on: ubuntu-latest
    steps:
      - name: Review through PR-Agent
        uses: The-PR-Agent/pr-agent@a76cb9111b6a944094e874b3d467c4e546946e7b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Host-only settings are ignored in repository .pr_agent.toml.
          CONFIG.NUM_RETRIES: '1'
          CONFIG.ENABLE_AUTO_APPROVAL: 'false'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
